# docker compose -f deploy/compose.yaml up -d   (run from the site/ folder)
# Caddy obtains and renews the HTTPS certificate for sirtraver.com automatically.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      PUBLIC_ORIGIN: https://sirtraver.com
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  data:
  caddy:
